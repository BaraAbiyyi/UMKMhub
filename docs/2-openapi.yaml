openapi: 3.1.0
info:
  title: UMKMHub REST API Contract
  version: 1.0.0
  description: |-
    Kontrak API resmi untuk platform **UMKMHub** (Integrasi Katalog dan Manajemen Pesanan UMKM).
    Disusun menggunakan pendekatan *API-first (design-first)* untuk menyelaraskan tim frontend, backend Laravel, dan QA testing.

servers:
  - url: https://api.umkmhub.id/api/v1
    description: Server Produksi (Production Gateway)
  - url: https://dev-api.umkmhub.id/api/v1
    description: Lingkungan Pengembangan (Development Server)

tags:
  - name: Auth
    description: Autentikasi dan manajemen sesi bearer token
  - name: Users
    description: Manajemen data pengguna dan singleton profile (/me)
  - name: Categories
    description: Master data kategori etalase produk UMKM
  - name: Products
    description: Katalog produk UMKM, inventaris stok, dan review
  - name: Orders
    description: Transaksi pemesanan, item pesanan, dan siklus hidup pesanan

security:
  - bearerAuth: []

paths:
  # ==========================================
  # TAG: CATEGORIES
  # ==========================================
  /categories:
    get:
      tags:
        - Categories
      summary: Daftar kategori produk
      description: Mengambil seluruh kategori produk untuk filter etalase.
      operationId: listCategories
      security: []
      responses:
        "200":
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "400":
          description: Request tidak valid

    post:
      tags:
        - Categories
      summary: Menambahkan kategori baru
      description: Hanya dapat dilakukan oleh pengguna dengan hak akses Administrator.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
            example:
              name: "Kerajinan Bambu"
              description: "Produk kerajinan anyaman bambu ramah lingkungan khas pedesaan"
      responses:
        "201":
          description: Kategori berhasil dibuat
          headers:
            Location:
              description: URI detail kategori baru
              schema:
                type: string
                example: "/api/v1/categories/5"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Categories
      summary: Memperbarui data kategori
      description: Mengubah nama atau deskripsi kategori tertentu.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateInput"
            example:
              name: "Kerajinan Ramah Lingkungan"
      responses:
        "200":
          description: Kategori berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Categories
      summary: Menghapus data kategori
      description: Menghapus kategori produk. Menolak penghapusan bila masih terdapat produk di dalam kategori ini.
      operationId: deleteCategory
      responses:
        "204":
          description: Kategori berhasil dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Kategori gagal dihapus karena masih memuat produk aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Kategori tidak dapat dihapus karena masih digunakan oleh produk aktif."
                code: "CATEGORY_IN_USE"

  # ==========================================
  # TAG: PRODUCTS
  # ==========================================
  /products:
    get:
      tags:
        - Products
      summary: Daftar katalog produk dengan filter dan pagination
      description: Mengambil etalase produk UMKM yang dapat difilter, dicari, diurutkan, serta dipaginasi.
      operationId: listProducts
      security: []
      parameters:
        - name: category_id
          in: query
          description: Filter produk berdasarkan ID kategori
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: is_active
          in: query
          description: Filter status keaktifan produk
          schema:
            type: boolean
          example: true
        - name: price_min
          in: query
          description: Batas harga minimum produk (Rupiah)
          schema:
            type: number
            minimum: 0
          example: 10000
        - name: price_max
          in: query
          description: Batas harga maksimum produk (Rupiah)
          schema:
            type: number
            minimum: 0
          example: 100000
        - name: q
          in: query
          description: Pencarian kata kunci pada nama atau deskripsi produk
          schema:
            type: string
            maxLength: 100
          example: "tempe"
        - name: sort
          in: query
          description: Field pengurutan. Beri tanda '-' di depan nama kolom untuk urutan menurun (descending).
          schema:
            type: string
            enum:
              - name
              - -name
              - price
              - -price
              - created_at
              - -created_at
            default: -created_at
          example: -created_at
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags:
        - Products
      summary: Menambahkan produk baru ke katalog
      description: Menambahkan produk UMKM baru. Dilakukan oleh Merchant atau Admin.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            example:
              name: "Keripik Singkong Balado Pedas Manis"
              description: "Keripik singkong renyah dengan taburan cabai asli dan gula merah alami 250g"
              category_id: 1
              price: 18000
              stock: 35
      responses:
        "201":
          description: Produk berhasil dibuat
          headers:
            Location:
              description: URI produk baru
              schema:
                type: string
                example: "/api/v1/products/6"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Products
      summary: Detail spesifikasi produk
      description: Mengambil data rinci sebuah produk berdasarkan ID.
      operationId: getProductById
      security: []
      responses:
        "200":
          description: Detail produk berhasil ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Products
      summary: Memperbarui sebagian atribut produk
      description: Memperbarui field produk tertentu seperti nama, harga, atau deskripsi tanpa mengganti keseluruhan entitas.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateInput"
            example:
              price: 17000
              stock: 45
      responses:
        "200":
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Products
      summary: Menghapus produk dari katalog
      description: Menghapus produk. Gagal bila produk sudah memiliki rekam jejak pesanan yang terkunci.
      operationId: deleteProduct
      responses:
        "204":
          description: Produk berhasil dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /products/{id}/stock:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Products
      summary: Memperbarui jumlah persediaan stok produk
      description: Aksi pembaruan kuantitas stok produk inventaris UMKM.
      operationId: updateProductStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpdateInput"
            example:
              stock: 60
      responses:
        "200":
          description: Stok produk berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      stock:
                        type: integer
                        example: 60
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-10-25T01:30:00+07:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /products/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Products
      summary: Daftar ulasan dan rating produk
      description: Mengambil riwayat ulasan pembeli terhadap produk tertentu.
      operationId: listProductReviews
      security: []
      responses:
        "200":
          description: Daftar ulasan berhasil dimuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Products
      summary: Menambahkan ulasan pembeli untuk produk
      description: Pembeli yang telah menyelesaikan transaksi dapat memberikan ulasan dan rating 1-5.
      operationId: createProductReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
            example:
              rating: 5
              comment: "Keripiknya benar-benar gurih dan tidak tengik, packaging sangat rapi!"
      responses:
        "201":
          description: Ulasan berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

# ==========================================
# COMPONENTS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token autentikasi API dengan format 'Bearer <token>'

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID unik penanda entitas resource
      schema:
        type: integer
        minimum: 1
      example: 1

    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman data yang ingin diambil
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PerPage:
      name: per_page
      in: query
      required: false
      description: Jumlah record per halaman (maksimal 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
      example: 10

  responses:
    Unauthorized:
      description: Token otentikasi tidak disediakan atau tidak valid (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Autentikasi diperlukan untuk mengakses resource ini."
            code: "UNAUTHORIZED"

    Forbidden:
      description: Pengguna tidak memiliki hak akses yang mencukupi (403)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Anda tidak berhak melakukan aksi ini."
            code: "FORBIDDEN"

    NotFound:
      description: Data resource yang diminta tidak ditemukan (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Data yang diminta tidak ditemukan."
            code: "NOT_FOUND"

    Conflict:
      description: Aksi bertentangan dengan state data saat ini (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Terjadi konflik state data."
            code: "CONFLICT"

    ValidationError:
      description: Validasi atribut request body atau query parameter gagal (422)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    # ------------------ Global Schemas ------------------
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Terjadi kesalahan pada permintaan Anda."
        code:
          type: string
          example: "BAD_REQUEST"

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: "Data yang dikirim tidak valid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name:
              - "Nama produk wajib diisi."
            price:
              - "Harga harus bernilai angka lebih dari 0."

    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        from:
          type:
            - integer
            - "null"
          example: 1
        to:
          type:
            - integer
            - "null"
          example: 5
        total:
          type: integer
          example: 25
        last_page:
          type: integer
          example: 3

    PaginationLinks:
      type: object
      properties:
        first:
          type:
            - string
            - "null"
          format: uri
          example: "https://api.umkmhub.id/api/v1/products?page=1&per_page=10"
        prev:
          type:
            - string
            - "null"
          format: uri
          example: null
        next:
          type:
            - string
            - "null"
          format: uri
          example: "https://api.umkmhub.id/api/v1/products?page=2&per_page=10"
        last:
          type:
            - string
            - "null"
          format: uri
          example: "https://api.umkmhub.id/api/v1/products?page=3&per_page=10"

    # ------------------ Category Schemas ------------------
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 100
          example: "Makanan Ringan"
        slug:
          type:
            - string
            - "null"
          readOnly: true
          example: "makanan-ringan"
        description:
          type:
            - string
            - "null"
          example: "Aneka camilan keripik, kue basah, dan jajanan pasar UMKM"

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: "Makanan Ringan"
        description:
          type:
            - string
            - "null"
          example: "Aneka makanan olahan tradisional"

    CategoryUpdateInput:
      type: object
      description: Input pembaruan data kategori (PATCH). Seluruh field opsional.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: "Makanan Ringan Khas Daerah"
        description:
          type:
            - string
            - "null"
          example: "Aneka makanan olahan tradisional khas daerah"

    # ------------------ Product Schemas ------------------
    Product:
      type: object
      required:
        - id
        - name
        - price
        - stock
        - is_active
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 200
          example: "Keripik Tempe Renyah"
        description:
          type:
            - string
            - "null"
          example: "Keripik tempe gurih renyah kemasan 200 gram khas Malang"
        category:
          $ref: "#/components/schemas/Category"
        price:
          type: number
          minimum: 0
          example: 15000
        stock:
          type: integer
          minimum: 0
          example: 50
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-12T08:00:00+07:00"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-15T10:30:00+07:00"

    ProductInput:
      type: object
      required:
        - name
        - price
        - category_id
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
          example: "Keripik Tempe Renyah"
        description:
          type:
            - string
            - "null"
          example: "Keripik tempe gurih renyah khas Malang 200g"
        category_id:
          type: integer
          minimum: 1
          example: 1
        price:
          type: number
          minimum: 0
          example: 15000
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 50

    ProductUpdateInput:
      type: object
      description: Input pembaruan sebagian data produk (PATCH). Seluruh field bersifat opsional.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
          example: "Keripik Tempe Renyah Spesial"
        description:
          type:
            - string
            - "null"
          example: "Kemasan baru lebih hemat dan gurih"
        category_id:
          type: integer
          minimum: 1
          example: 1
        price:
          type: number
          minimum: 0
          example: 17000
        stock:
          type: integer
          minimum: 0
          example: 45
        is_active:
          type: boolean
          example: true

    StockUpdateInput:
      type: object
      required:
        - stock
      properties:
        stock:
          type: integer
          minimum: 0
          description: Jumlah stok fisik terkini di gudang UMKM
          example: 45

    ProductList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Review:
      type: object
      required:
        - id
        - product_id
        - rating
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        product_id:
          type: integer
          example: 1
        user_name:
          type: string
          example: "Budi Santoso"
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type:
            - string
            - "null"
          example: "Produk sangat segar dan kemasan aman."
        created_at:
          type: string
          format: date-time
          example: "2026-10-14T11:20:00+07:00"

    ReviewInput:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type:
            - string
            - "null"
          maxLength: 500
          example: "Rasa autentik enak sekali!"