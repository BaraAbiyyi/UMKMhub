openapi: 3.1.0
info:
  title: UMKMHub API
  version: 1.0.0
  description: |-
    Kontrak OpenAPI v1 resmi untuk platform **UMKMHub** (Katalog Produk dan Manajemen Pesanan UMKM).
    Disusun sebagai bagian kedua **Milestone M2 – API Blueprint** berdasarkan kesepakatan rancangan *API Design Document v1 (Minggu 4)*.

    ### Identitas Tim Pengembang (Kelompok 1)
    * **Bara Abiyyi Muslimin** (Products - Penyusun Akhir)
    * **Afsani Wahyu Mawardi** (Categories - Reviewer Status Code)
    * **Arif Nur Syifa** (Stocks - Specialist Concurrency Control)
    * **Agil Syeh Febukhori** (Customers - Reviewer Format JSON)
    * **Yesa Anggit Prayugo** (Orders & Order Items)

    ### Prinsip Desain & Aturan Bisnis
    1. **API-first / Design-first**: Menjadi single source of truth bagi backend Laravel, frontend web/mobile, dan automated contract testing.
    2. **Format Pertukaran Data**: Seluruh request dan response menggunakan format `application/json` dengan data envelope standar `"data"`.
    3. **Concurrency Control**: Resource stok (`stocks`) mengimplementasikan mekanisme *Optimistic Concurrency Control (OCC)* berbasis field `version` untuk mencegah *race condition* dan *lost update*.
    4. **Aksi Non-CRUD Status Transaksi**: Perubahan siklus hidup pesanan dimodelkan sebagai *Resource Attribute Update* melalui endpoint `PATCH /orders/{id}/status`.
    5. **Otorisasi & Keamanan**: Menggunakan skema HTTP Bearer Token (Laravel Sanctum) secara global, dengan pengecualian `security: []` pada endpoint publik.
  contact:
    name: Kelompok 1 – Pemrograman Web Service
    email: dev@umkmhub.id
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Lingkungan Pengembangan Lokal (Local Development Server)
  - url: https://api.umkmhub.id/api/v1
    description: Server Produksi (Production Gateway)

tags:
  - name: Auth
    description: Autentikasi user dan penerbitan Bearer token
  - name: Categories
    description: Pengelolaan master data kategori produk UMKM
  - name: Products
    description: Pengelolaan katalog dan etalase produk UMKM
  - name: Stocks
    description: Monitoring dan pembaruan kuantitas stok dengan Optimistic Locking
  - name: Customers
    description: Pendaftaran dan pengelolaan data pelanggan UMKM
  - name: Orders
    description: Transaksi pemesanan (checkout) dan manajemen siklus hidup pesanan

security:
  - bearerAuth: []

paths:
  # ==========================================
  # 1. AUTHENTICATION
  # ==========================================
  /auth/login:
    post:
      tags:
        - Auth
      summary: Autentikasi user & penerbitan Bearer token
      description: Endpoint publik untuk menukarkan kredensial email dan password dengan token otentikasi Bearer (Laravel Sanctum).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: "admin@umkmhub.id"
              password: "password123"
      responses:
        "200":
          description: Login berhasil, Bearer token dikembalikan
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthToken"
              example:
                data:
                  token_type: "Bearer"
                  access_token: "1|sanctum_token_umkmhub_abcdef123456"
                  expires_in: 86400
        "400":
          description: Format payload JSON tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Format JSON yang dikirimkan tidak valid."
                code: "BAD_REQUEST"
        "401":
          description: Kredensial email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Email atau password yang Anda masukkan salah."
                code: "INVALID_CREDENTIALS"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ==========================================
  # 2. PRODUCTS
  # ==========================================
  /products:
    get:
      tags:
        - Products
      summary: Daftar produk katalog
      description: Mengambil daftar katalog produk UMKM dengan dukungan filter kategori, status keaktifan, pencarian kata kunci (q), whitelist sort, dan paginasi.
      operationId: listProducts
      security: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filter produk berdasarkan ID kategori
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: is_active
          in: query
          required: false
          description: Filter status keaktifan produk
          schema:
            type: boolean
          example: true
        - name: q
          in: query
          required: false
          description: Pencarian kata kunci pada nama dan deskripsi produk
          schema:
            type: string
            maxLength: 100
          example: "tempe"
        - name: sort
          in: query
          required: false
          description: Field pengurutan data katalog. Gunakan awalan '-' untuk pengurutan menurun (descending).
          schema:
            type: string
            enum:
              - price
              - -price
              - name
              - -created_at
            default: -created_at
          example: -created_at
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
              example:
                data:
                  - id: 1
                    name: "Keripik Tempe Renyah"
                    description: "Keripik tempe gurih renyah kemasan 200 gram khas Malang"
                    price: 15000
                    category:
                      id: 1
                      name: "Makanan Ringan"
                    is_active: true
                    created_at: "2026-10-12T08:00:00Z"
                  - id: 2
                    name: "Kopi Robusta Dampit 250g"
                    description: "Kopi bubuk robusta petik merah kemasan 250 gram"
                    price: 35000
                    category:
                      id: 2
                      name: "Minuman"
                    is_active: true
                    created_at: "2026-10-12T08:00:00Z"
                links:
                  first: "https://api.umkmhub.id/api/v1/products?page=1&per_page=2"
                  last: "https://api.umkmhub.id/api/v1/products?page=3&per_page=2"
                  prev: null
                  next: "https://api.umkmhub.id/api/v1/products?page=2&per_page=2"
                meta:
                  current_page: 1
                  last_page: 3
                  per_page: 2
                  total: 5
        "400":
          description: Parameter query tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Parameter filter atau sort tidak valid."
                code: "INVALID_QUERY_PARAMETER"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags:
        - Products
      summary: Tambah produk baru ke katalog
      description: Menambahkan produk baru ke katalog etalase UMKM. Operasi ini dibatasi khusus untuk Aktor Administrator.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            example:
              category_id: 1
              name: "Keripik Tempe Renyah"
              description: "Keripik tempe gurih renyah kemasan 200 gram khas Malang"
              price: 15000
              is_active: true
      responses:
        "201":
          description: Produk berhasil dibuat
          headers:
            Location:
              description: URI detail produk baru
              schema:
                type: string
                example: "/api/v1/products/1"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Request body format JSON tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Format JSON yang dikirimkan tidak valid."
                code: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Products
      summary: Detail spesifik suatu produk
      description: Mengambil data detail spesifik suatu produk berdasarkan ID unik produk, termasuk relasi kategori.
      operationId: getProduct
      security: []
      responses:
        "200":
          description: Detail produk berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
              example:
                data:
                  id: 1
                  name: "Keripik Tempe Renyah"
                  description: "Keripik tempe gurih renyah kemasan 200 gram khas Malang"
                  price: 15000
                  category:
                    id: 1
                    name: "Makanan Ringan"
                  is_active: true
                  created_at: "2026-10-12T08:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Products
      summary: Perbarui sebagian data produk
      description: Memperbarui sebagian atribut data produk (PATCH) seperti harga, nama, deskripsi, atau status keaktifan. Khusus Aktor Administrator.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateInput"
            example:
              price: 16000
              is_active: true
      responses:
        "200":
          description: Data produk berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Products
      summary: Hapus produk dari katalog
      description: Menghapus produk dari katalog UMKM. Ditolak bila produk masih tercatat dalam transaksi pesanan. Khusus Aktor Administrator.
      operationId: deleteProduct
      responses:
        "204":
          description: Produk berhasil dihapus dari katalog (No Content)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ==========================================
  # 3. CATEGORIES
  # ==========================================
  /categories:
    get:
      tags:
        - Categories
      summary: Daftar seluruh kategori produk
      description: Mengambil seluruh kategori produk untuk filter etalase katalog. Dapat diakses oleh semua pengguna (publik).
      operationId: listCategories
      security: []
      responses:
        "200":
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
              example:
                data:
                  - id: 1
                    name: "Makanan Ringan"
                    description: "Aneka camilan keripik dan jajanan pasar UMKM"
                  - id: 2
                    name: "Minuman"
                    description: "Kopi, teh herbal, dan minuman kemasan lokal"
        "400":
          description: Permintaan tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Permintaan data kategori tidak valid."
                code: "BAD_REQUEST"

    post:
      tags:
        - Categories
      summary: Tambah kategori baru
      description: Menambahkan kategori baru ke dalam sistem UMKMHub. Khusus Aktor Administrator.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
            example:
              name: "Kerajinan Tangan"
              description: "Produk kerajinan anyaman bambu dan souvenir khas pedesaan"
      responses:
        "201":
          description: Kategori berhasil dibuat
          headers:
            Location:
              description: URI detail kategori baru
              schema:
                type: string
                example: "/api/v1/categories/5"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Kategori dengan nama tersebut sudah ada di sistem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Kategori dengan nama tersebut sudah terdaftar."
                code: "CATEGORY_ALREADY_EXISTS"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ==========================================
  # 4. STOCKS
  # ==========================================
  /stocks:
    get:
      tags:
        - Stocks
      summary: Monitoring jumlah stok seluruh produk
      description: Monitoring ketersediaan kuantitas stok seluruh produk UMKM dengan filter peringatan stok menipis (low_stock), sort, dan paginasi. Khusus Aktor Administrator.
      operationId: listStocks
      parameters:
        - name: low_stock
          in: query
          required: false
          description: Filter stok yang menipis (kuantitas <= 10)
          schema:
            type: boolean
          example: true
        - name: sort
          in: query
          required: false
          description: Field pengurutan data stok. Beri awalan '-' untuk urutan menurun (descending).
          schema:
            type: string
            enum:
              - quantity
              - -quantity
              - updated_at
            default: quantity
          example: quantity
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Monitoring data stok produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockList"
              example:
                data:
                  - id: 1
                    product_id: 1
                    quantity: 50
                    version: 1
                    updated_at: "2026-10-24T09:15:00Z"
                  - id: 2
                    product_id: 2
                    quantity: 25
                    version: 1
                    updated_at: "2026-10-24T09:15:00Z"
                links:
                  first: "https://api.umkmhub.id/api/v1/stocks?page=1&per_page=15"
                  last: "https://api.umkmhub.id/api/v1/stocks?page=1&per_page=15"
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 15
                  total: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stocks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Stocks
      summary: Update jumlah stok dengan Optimistic Locking
      description: Memperbarui jumlah stok fisik inventaris UMKM menggunakan mekanisme Optimistic Locking berbasis field version. Client wajib menyertakan nilai version terkini. Jika version di server telah berubah, server merespons 409 Conflict. Khusus Aktor Administrator.
      operationId: updateStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpdateInput"
            example:
              quantity: 60
              version: 1
      responses:
        "200":
          description: Jumlah stok berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Stock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Konflik concurrency kontrol stok (Optimistic Lock mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "STOK_VERSION_MISMATCH"
                message: "Stok telah diperbarui oleh pengguna lain. Silakan muat ulang data terbaru."
        "422":
          $ref: "#/components/responses/ValidationError"

  # ==========================================
  # 5. CUSTOMERS
  # ==========================================
  /customers:
    post:
      tags:
        - Customers
      summary: Pendaftaran pelanggan baru
      description: Mendaftarkan profil pelanggan UMKM baru dengan mengisi nama, nomor telepon, dan alamat domisili. Endpoint terbuka untuk umum.
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
            example:
              name: "Budi Santoso"
              phone: "081234567890"
              address: "Jl. Semanggi Timur No. 12, Malang"
      responses:
        "201":
          description: Pelanggan berhasil didaftarkan
          headers:
            Location:
              description: URI detail pelanggan baru
              schema:
                type: string
                example: "/api/v1/customers/1"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Customer"
        "400":
          description: Format data pendaftaran JSON tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Format JSON pendaftaran tidak valid."
                code: "BAD_REQUEST"
        "422":
          $ref: "#/components/responses/ValidationError"

  /customers/{id}/orders:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Customers
      summary: Riwayat pesanan milik pelanggan tertentu
      description: Mengambil seluruh riwayat transaksi pesanan milik pelanggan tertentu (Nested Resource). Khusus dapat diakses oleh Aktor Pelanggan yang bersangkutan.
      operationId: listCustomerOrders
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Riwayat pesanan pelanggan berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pelanggan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Data pelanggan tidak ditemukan."
                code: "CUSTOMER_NOT_FOUND"

  # ==========================================
  # 6. ORDERS & ORDER ITEMS
  # ==========================================
  /orders:
    post:
      tags:
        - Orders
      summary: Checkout pesanan baru
      description: Mengajukan transaksi pemesanan baru. Sistem memvalidasi ketersediaan stok produk, memotong kuantitas stok, dan mengunci transaksi secara atomik (Database Transaction). Aktor Pelanggan.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
            example:
              customer_id: 1
              items:
                - product_id: 1
                  quantity: 2
                - product_id: 2
                  quantity: 1
      responses:
        "201":
          description: Pesanan berhasil dibuat (Checkout sukses)
          headers:
            Location:
              description: URI detail pesanan baru
              schema:
                type: string
                example: "/api/v1/orders/1"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Format request body JSON tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Format JSON yang dikirimkan tidak valid."
                code: "BAD_REQUEST"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Stok produk tidak mencukupi untuk item pesanan yang diminta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "INSUFFICIENT_STOCK"
                message: "Stok tidak mencukupi untuk produk: Keripik Tempe Renyah"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Orders
      summary: Detail rincian pesanan dan item yang dipesan
      description: Mengambil data lengkap sebuah transaksi pesanan termasuk rincian order-items dan nilai total transaksi. Khusus Aktor Pelanggan.
      operationId: getOrder
      responses:
        "200":
          description: Detail rincian pesanan berhasil ditemukan
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
              example:
                data:
                  id: 1
                  customer_id: 1
                  total_amount: 65000
                  status: "pending"
                  items:
                    - id: 1
                      product_id: 1
                      quantity: 2
                      price: 15000
                      subtotal: 30000
                    - id: 2
                      product_id: 2
                      quantity: 1
                      price: 35000
                      subtotal: 35000
                  created_at: "2026-10-25T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Orders
      summary: Mengubah status transaksi pesanan
      description: Aksi Non-CRUD yang dimodelkan sebagai Resource Attribute Update untuk memperbarui siklus status pesanan (pending -> processing -> completed atau cancelled). Khusus Aktor Administrator.
      operationId: updateOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
            example:
              status: "processing"
      responses:
        "200":
          description: Status pesanan berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

# ==========================================
# COMPONENTS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Masukkan API Bearer Token yang diperoleh saat autentikasi login (contoh 'Bearer <token>').

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID unik penanda entitas resource (integer positif)
      schema:
        type: integer
        minimum: 1
      example: 1

    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman data yang ingin dimuat
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PerPage:
      name: per_page
      in: query
      required: false
      description: Jumlah data per halaman (maksimum 100, default 15)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
      example: 15

  responses:
    Unauthorized:
      description: Token otentikasi tidak disediakan atau tidak valid (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Autentikasi diperlukan untuk mengakses resource ini."
            code: "UNAUTHORIZED"

    Forbidden:
      description: Pengguna tidak memiliki hak akses yang mencukupi untuk aksi ini (403)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Anda tidak berhak melakukan aksi ini."
            code: "FORBIDDEN"

    NotFound:
      description: Data resource yang diminta tidak ditemukan (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Data resource yang diminta tidak ditemukan."
            code: "NOT_FOUND"

    Conflict:
      description: Aksi bertentangan dengan kondisi atau versi state resource saat ini (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Terjadi konflik state atau versi data."
            code: "CONFLICT"

    ValidationError:
      description: Validasi atribut request body atau query parameter gagal (422)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            message: "Data yang dikirimkan tidak valid."
            errors:
              price:
                - "Harga produk harus bernilai positif."

  schemas:
    # ------------------ Standar Error & Pagination ------------------
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Stok telah diperbarui oleh pengguna lain. Silakan muat ulang data terbaru."
        code:
          type: string
          example: "STOK_VERSION_MISMATCH"

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: "Data yang dikirimkan tidak valid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            price:
              - "Harga produk harus bernilai positif."

    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 25
        last_page:
          type: integer
          example: 2

    PaginationLinks:
      type: object
      properties:
        first:
          type:
            - string
            - "null"
          format: uri
          example: "https://api.umkmhub.id/api/v1/products?page=1&per_page=15"
        prev:
          type:
            - string
            - "null"
          format: uri
          example: null
        next:
          type:
            - string
            - "null"
          format: uri
          example: "https://api.umkmhub.id/api/v1/products?page=2&per_page=15"
        last:
          type:
            - string
            - "null"
          format: uri
          example: "https://api.umkmhub.id/api/v1/products?page=2&per_page=15"

    # ------------------ Auth Schemas ------------------
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@umkmhub.id"
        password:
          type: string
          format: password
          minLength: 8
          example: "password123"

    AuthToken:
      type: object
      required:
        - token_type
        - access_token
      properties:
        token_type:
          type: string
          example: "Bearer"
        access_token:
          type: string
          example: "1|sanctum_token_umkmhub_abcdef123456"
        expires_in:
          type: integer
          example: 86400

    # ------------------ Category Schemas ------------------
    CategorySummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Makanan Ringan"

    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 100
          example: "Makanan Ringan"
        description:
          type:
            - string
            - "null"
          example: "Aneka camilan keripik dan jajanan pasar UMKM"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-12T08:00:00Z"

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: "Makanan Ringan"
        description:
          type:
            - string
            - "null"
          example: "Aneka camilan olahan tradisional khas daerah"

    # ------------------ Product Schemas ------------------
    Product:
      type: object
      required:
        - id
        - name
        - price
        - category
        - is_active
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 150
          example: "Keripik Tempe Renyah"
        description:
          type:
            - string
            - "null"
          example: "Keripik tempe gurih renyah kemasan 200 gram khas Malang"
        price:
          type: number
          minimum: 0
          example: 15000
        category:
          $ref: "#/components/schemas/CategorySummary"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-12T08:00:00Z"

    ProductInput:
      type: object
      required:
        - category_id
        - name
        - price
      properties:
        category_id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          maxLength: 150
          example: "Keripik Tempe Renyah"
        description:
          type:
            - string
            - "null"
          example: "Keripik tempe gurih renyah kemasan 200 gram khas Malang"
        price:
          type: number
          minimum: 0
          example: 15000
        is_active:
          type: boolean
          default: true
          example: true

    ProductUpdateInput:
      type: object
      description: Input pembaruan sebagian atribut produk (PATCH). Seluruh field bersifat opsional.
      properties:
        category_id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          maxLength: 150
          example: "Keripik Tempe Renyah Spesial"
        description:
          type:
            - string
            - "null"
          example: "Kemasan baru lebih hemat dan gurih renyah"
        price:
          type: number
          minimum: 0
          example: 16000
        is_active:
          type: boolean
          example: true

    ProductList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ------------------ Stock Schemas ------------------
    Stock:
      type: object
      required:
        - id
        - product_id
        - quantity
        - version
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        product_id:
          type: integer
          readOnly: true
          example: 1
        quantity:
          type: integer
          minimum: 0
          example: 50
        version:
          type: integer
          minimum: 1
          example: 1
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-24T09:15:00Z"

    StockUpdateInput:
      type: object
      required:
        - quantity
        - version
      properties:
        quantity:
          type: integer
          minimum: 0
          description: Jumlah fisik stok produk terkini di gudang UMKM
          example: 60
        version:
          type: integer
          minimum: 1
          description: Nomor versi stok saat ini untuk Optimistic Locking Concurrency
          example: 1

    StockList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Stock"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ------------------ Customer Schemas ------------------
    Customer:
      type: object
      required:
        - id
        - name
        - phone
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 150
          example: "Budi Santoso"
        phone:
          type: string
          maxLength: 30
          example: "081234567890"
        address:
          type:
            - string
            - "null"
          example: "Jl. Semanggi Timur No. 12, Malang"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-24T09:20:00Z"

    CustomerInput:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
          maxLength: 150
          example: "Budi Santoso"
        phone:
          type: string
          maxLength: 30
          example: "081234567890"
        address:
          type:
            - string
            - "null"
          example: "Jl. Semanggi Timur No. 12, Malang"

    # ------------------ Order & Order Item Schemas ------------------
    OrderItem:
      type: object
      required:
        - id
        - product_id
        - quantity
        - price
        - subtotal
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 15000
        subtotal:
          type: number
          minimum: 0
          example: 30000

    OrderItemInput:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    Order:
      type: object
      required:
        - id
        - customer_id
        - total_amount
        - status
        - items
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        customer_id:
          type: integer
          example: 1
        total_amount:
          type: number
          minimum: 0
          example: 65000
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - cancelled
          example: "pending"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-25T10:00:00Z"

    OrderInput:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: integer
          minimum: 1
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - cancelled
          example: "processing"

    OrderList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
